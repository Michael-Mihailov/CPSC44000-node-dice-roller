<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Web Dice Roller</title>
    
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>
<body onload="start()">
    <main class="d-flex flex-column align-items-center">
        <div class="yahtzee card shadow-lg rounded-4 boarder-1">
            <header class="card-header d-flex flex-column align-items-center">
                <h1>Yahtzee Dice Roller</h1>
                <div class="game-description">
                    <p>This website can be used in place of real dice to play Yahtzee! Press the “Roll Dice” button to roll all five dice...</p>
                </div>
            </header>
            <div class="card-body d-flex flex-column align-items-center">
                <div class="game d-flex align-items-center" id="game"></div>
                <div class="user-input d-flex flex-column align-items-center">
                    <button class="btn btn-primary btn-lg" autofocus onclick="rollDice()">
                        Roll Dice!
                    </button>
                </div>
            </div>
        </div>
    </main>
    <script src="main.js"></script>
</body>
</html>
